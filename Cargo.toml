[package]
name = "bmo"
version = "0.1.0"
edition = "2024"
description = "A host where agents build desktop apps."
license = "Apache-2.0"
publish = false

[dependencies]
gpui-shell = "=0.11.0"
gpui-base = "=0.11.0"
gpui-fast = { version = "0.1", features = ["test-support"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tracing = "0.1"
ureq = "2"
wait-timeout = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"

[profile.release]
strip = "symbols"
